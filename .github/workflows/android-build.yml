name: Android debug build (feature branch)

on:
  push:
    branches:
      - feature/lean-vpn-no-warp
  workflow_dispatch:

concurrency:
  group: android-build-lean-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Go for the pinned Arman JNI backend
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false

      - name: Restore Argo pool snapshot from the original 1.2.51 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/argo
          gzip -dc third_party/argo/argo-pool.json.gz > app/src/main/assets/argo/argo-pool.json
          echo "7712ca8c0ddf1aab957a3d24e75f01613034e7ab14d06a9650eab588333bec6c  app/src/main/assets/argo/argo-pool.json" | sha256sum -c -

      - name: Build pinned Arman GoMobile JNI AAR (complete runtime namespace)
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/arman-vpn-client"
          git clone --filter=blob:none --no-checkout https://github.com/armanlife/arman-vpn-client.git "$SRC"
          git -C "$SRC" checkout --detach 492dd7f389c539790cde3d07167535d28788a0d0

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"

          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          cd "$SRC/core"
          gomobile bind -target=android/arm,android/arm64 -androidapi 24 -o "$RUNNER_TEMP/arman-core.aar" ./mobile

          python3 "$GITHUB_WORKSPACE/scripts/repackage-arman-gomobile-aar.py" "$RUNNER_TEMP/arman-core.aar" "$GITHUB_WORKSPACE/app/libs/arman-core.aar"
      - name: Build Arman hev-socks5-tunnel JNI library
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/arman-vpn-client"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH="$SRC/app/android/hev-socks5-tunnel" \
            APP_BUILD_SCRIPT="$SRC/app/android/hev-socks5-tunnel/Android.mk" \
            NDK_APPLICATION_MK="$SRC/app/android/hev-socks5-tunnel/Application.mk" \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_PLATFORM=android-24 \
            APP_OPTIM=release \
            APP_CFLAGS="-O3 -DPKGNAME=com/mlmvpn/scanner/engines/fenix/arman -DCLSNAME=Tun2Socks" \
            APP_SUPPORT_FLEXIBLE_PAGE_SIZES=true \
            REV_ID=2.19.3 \
            NDK_OUT="$RUNNER_TEMP/hev-obj" \
            NDK_LIBS_OUT="$RUNNER_TEMP/hev-libs"

          for abi in arm64-v8a armeabi-v7a; do
            src="$RUNNER_TEMP/hev-libs/$abi/libhev-socks5-tunnel.so"
            dst="$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"
            test -s "$src"
            mkdir -p "$(dirname "$dst")"
            cp "$src" "$dst"
            strings -a "$dst" | grep -Fq 'com/mlmvpn/scanner/engines/fenix/arman/Tun2Socks'
            readelf -h "$dst" | grep -q 'Machine:'
          done


      - name: Remove Windows-only local JDK settings from CI checkout
        run: |
          find . -name gradle.properties -type f -exec sed -i '/^org.gradle.java.home=/d; /^org.gradle.java.installations.paths=/d; s/ -Djdk.net.unixdomain.tmpdir=[^ ]*//' {} +
          if grep -R -n 'org.gradle.java.home\|org.gradle.java.installations.paths' --include=gradle.properties .; then
            echo "A local JDK path is still present in Gradle properties"
            exit 1
          fi

      - name: Fetch pinned VPN engine AARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar \
            -o app/libs/libv2ray.aar
          echo "cdfef146218233a31a8b52c8b1016557730d3b63fc121d4c84cacea50e669155  app/libs/libv2ray.aar" | sha256sum -c -

          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/Windscribe/Android-App/2c585dd5979ba93655853d56d849ed8ad2c964cb/base/src/main/libs/wsnet.aar \
            -o app/libs/wsnet.aar
          echo "5b0145d526aa10f6b7ec094639bfc8dc2f187d76d1b70915cf4da4802b822f11  app/libs/wsnet.aar" | sha256sum -c -

          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/v2.0.39/ca/psiphon/psiphontunnel/2.0.39/psiphontunnel-2.0.39.aar \
            -o app/libs/psiphontunnel-2.0.39.aar
          echo "e131f63e6c88e61d2cd9a0e5fc503ee4eda3f816  app/libs/psiphontunnel-2.0.39.aar" | sha1sum -c -
          python3 scripts/repackage-psiphon-aar.py app/libs/psiphontunnel-2.0.39.aar
          rm app/libs/psiphontunnel-2.0.39.aar
          test -s app/libs/libv2ray.aar
          test -s app/libs/wsnet.aar
          test -s app/libs/psiphontunnel-2.0.39-ns.aar


      - name: Fetch pinned tun2proxy 0.7.21 Android JNI libraries
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/tun2proxy-android-libs.zip"
          DEST="app/src/main/jniLibs"
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/tun2proxy/tun2proxy/releases/download/v0.7.21/tun2proxy-android-libs.zip \
            -o "$ARCHIVE"
          echo "25fe0fb6c853cbb8b1c0c58db8eb9b3f9901336d3511edec5650651c1144c11e  $ARCHIVE" | sha256sum -c -
          python3 - "$ARCHIVE" "$DEST" <<'PY'
          import pathlib, sys, zipfile
          archive, destination = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          wanted = {"arm64-v8a", "armeabi-v7a"}
          found = set()
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  if item.is_dir() or pathlib.PurePosixPath(item.filename).name != "libtun2proxy.so":
                      continue
                  parts = pathlib.PurePosixPath(item.filename).parts
                  abi = next((part for part in parts if part in wanted), None)
                  if abi is None:
                      continue
                  target = destination / abi / "libtun2proxy.so"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
                  found.add(abi)
                  print(f"Installed {target} ({target.stat().st_size} bytes)")
          missing = wanted - found
          if missing:
              raise SystemExit(f"tun2proxy archive missing ABI libraries: {sorted(missing)}")
          PY
          test -s "$DEST/arm64-v8a/libtun2proxy.so"
          test -s "$DEST/armeabi-v7a/libtun2proxy.so"

      - name: Fetch pinned MHRV 1.9.38 Android JNI cores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          ARM64="$RUNNER_TEMP/mhrv-arm64.apk"
          ARMV7="$RUNNER_TEMP/mhrv-armv7.apk"
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/therealaleph/MasterHttpRelayVPN-RUST/releases/download/v1.9.38/mhrv-rs-android-arm64-v8a-v1.9.38.apk \
            -o "$ARM64"
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/therealaleph/MasterHttpRelayVPN-RUST/releases/download/v1.9.38/mhrv-rs-android-armeabi-v7a-v1.9.38.apk \
            -o "$ARMV7"
          echo "8f5764e27bc3c590bfaf037f6050c03fc8a0dc6203ee0e1e7e277efbba0a1437  $ARM64" | sha256sum -c -
          echo "caf03ff7e0ec9140d4e75d60183ca574fa64d81d49ce692ddb8da706f3afab80  $ARMV7" | sha256sum -c -
          python3 - "$ARM64" "$ARMV7" app/src/main/jniLibs <<'PY'
          import pathlib, sys, zipfile
          specs = [
              (pathlib.Path(sys.argv[1]), "arm64-v8a"),
              (pathlib.Path(sys.argv[2]), "armeabi-v7a"),
          ]
          root = pathlib.Path(sys.argv[3])
          for apk, abi in specs:
              with zipfile.ZipFile(apk) as z:
                  matches = [n for n in z.namelist()
                             if pathlib.PurePosixPath(n).name == "libmhrv_rs.so"
                             and abi in pathlib.PurePosixPath(n).parts]
                  if len(matches) != 1:
                      raise SystemExit(f"{apk.name}: expected one libmhrv_rs.so for {abi}, found {matches}")
                  target = root / abi / "libmhrv_rs.so"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(matches[0]))
                  print(f"Installed {target} ({target.stat().st_size} bytes)")
          PY
          test -s app/src/main/jniLibs/arm64-v8a/libmhrv_rs.so
          test -s app/src/main/jniLibs/armeabi-v7a/libmhrv_rs.so

      - name: Build debug APKs
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Verify all requested modules are actually packaged
        shell: bash
        run: |
          set -uo pipefail
          OUT="app/build/outputs/apk/debug"
          FAILED=0
          bash scripts/verify-selected-apk.sh "$OUT/mlmvpn-1.2.45-arm64-v8a-debug.apk" arm64-v8a || FAILED=1
          bash scripts/verify-selected-apk.sh "$OUT/mlmvpn-1.2.45-armeabi-v7a-debug.apk" armeabi-v7a || FAILED=1
          bash scripts/verify-selected-apk.sh "$OUT/mlmvpn-1.2.45-universal-debug.apk" arm64-v8a || FAILED=1
          bash scripts/verify-selected-apk.sh "$OUT/mlmvpn-1.2.45-universal-debug.apk" armeabi-v7a || FAILED=1
          exit "$FAILED"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mahdivpn-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

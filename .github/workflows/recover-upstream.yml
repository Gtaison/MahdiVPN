name: Recover upstream Argo and Mami sources (read-only snapshot)

on:
  push:
    branches:
      - analysis/recover-mlm-1.2.49

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated recovery branch
        uses: actions/checkout@v4
        with:
          ref: analysis/recover-mlm-1.2.49

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch exact user-provided MLMVPN 1.2.51 APK (SHA-256 pinned)
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/mlmvpn-1.2.51.apk"
          # Public download link from the Telegram post carrying the same 1.2.51 APK
          # previously supplied for this task. Never trust the host without hash verification.
          if curl -fL --retry 2 --retry-delay 2 \
              https://guardts.ir/f/07cb9d50fb02 -o "$APK" &&
              echo "b2d2d0672b5bcfc1e79d3569650d087f8e55011db3f7fc46575b5bc5843e1cdf  $APK" | sha256sum -c -; then
            echo "Using exact MLMVPN 1.2.51 APK; checksum matches the previously supplied file."
            echo "APK_SOURCE=MLMVPN-1.2.51-user-upload" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not retrieve the pinned 1.2.51 APK; using official 1.2.49 only as a fallback for source reconnaissance."
            echo "APK_SOURCE=MLMVPN-1.2.49-fallback" >> "$GITHUB_ENV"
            curl -fL --retry 3 --retry-delay 2 \
              https://github.com/mlmvpn/mlmvpn_android/releases/download/v1.2.49/mlmvpn-1.2.49-universal-release.apk \
              -o "$APK"
          fi
          unzip -l "$APK" | grep -q 'classes.dex'

      - name: Fetch JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip \
            -o "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          test -x "$RUNNER_TEMP/jadx/bin/jadx"

      - name: Decompile and isolate original engine and UI packages
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/mlmvpn-1.2.51.apk"
          OUT="$RUNNER_TEMP/jadx-out"
          set +e
          "$RUNNER_TEMP/jadx/bin/jadx" --no-res --show-bad-code -j 4 -d "$OUT" "$APK"
          JADX_STATUS=$?
          set -e
          echo "JADX exit status: $JADX_STATUS (non-zero is tolerated only when required package sources are present)"
          SRC="$OUT/sources/com/mlmvpn/scanner"
          DEST="recovered/$APK_SOURCE"
          mkdir -p "$DEST"
          for package in engines/argo engines/mami ui/argo ui/mami engines/fenix/arman ui/fenix; do
            test -d "$SRC/$package" || { echo "Missing decompiled package: $package"; exit 1; }
            mkdir -p "$DEST/$package"
            cp -a "$SRC/$package/." "$DEST/$package/"
          done
          test -s "$DEST/engines/argo/ArgoEngine.java"
          test -s "$DEST/engines/mami/MamiEngine.java"
          test -s "$DEST/ui/argo/ArgoScreenKt.java"
          test -s "$DEST/ui/mami/MamiScreenKt.java"
          test -s "$DEST/engines/fenix/arman/ArmanEngine.java"
          test -s "$DEST/engines/fenix/arman/ArmanCore.java"
          test -s "$DEST/ui/fenix/FenixArmanScreenKt.java"
          {
            echo "Source: $APK_SOURCE"
            echo "Exact 1.2.51 SHA-256 (when selected): b2d2d0672b5bcfc1e79d3569650d087f8e55011db3f7fc46575b5bc5843e1cdf"
            echo "Fallback release: https://github.com/mlmvpn/mlmvpn_android/releases/tag/v1.2.49"
            echo "Decompiler: JADX v1.5.7"
            echo "This is a GPL-3.0-derived recovery snapshot. Preserve the upstream attribution required by the source repository's license."
            echo
            find "$DEST" -type f -name '*.java' -printf '%P %s bytes\n' | sort
          } > "$DEST/PROVENANCE.txt"

      - name: Commit recovery snapshot to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered/upstream-1.2.49
          git commit -m "Recover Argo and Mami source snapshot from upstream 1.2.49 APK"
          git push origin "HEAD:refs/heads/recovered-source-${GITHUB_RUN_ID}"

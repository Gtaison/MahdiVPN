name: Recover upstream Argo and Mami sources (isolated snapshot)

on:
  push:
    branches:
      - analysis/recover-mlm-1.2.49

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature baseline (without recovery workflow history)
        uses: actions/checkout@v4
        with:
          ref: feature/lean-vpn-no-warp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch official upstream 1.2.49 universal APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/mlmvpn/mlmvpn_android/releases/download/v1.2.49/mlmvpn-1.2.49-universal-release.apk \
            -o "$RUNNER_TEMP/mlmvpn-1.2.49.apk"
          unzip -l "$RUNNER_TEMP/mlmvpn-1.2.49.apk" | grep -q 'classes.dex'
          echo "APK_SOURCE=official-MLMVPN-1.2.49" >> "$GITHUB_ENV"

      - name: Fetch JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip \
            -o "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          test -x "$RUNNER_TEMP/jadx/bin/jadx"

      - name: Decompile and isolate original engine and UI packages
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/mlmvpn-1.2.49.apk"
          OUT="$RUNNER_TEMP/jadx-out"
          set +e
          "$RUNNER_TEMP/jadx/bin/jadx" --no-res --show-bad-code -j 4 -d "$OUT" "$APK"
          JADX_STATUS=$?
          set -e
          echo "JADX exit status: $JADX_STATUS (non-zero is tolerated only when required package sources are present)"
          SRC="$OUT/sources/com/mlmvpn/scanner"
          DEST="recovered/upstream-1.2.49"
          mkdir -p "$DEST"
          for package in engines/argo engines/mami ui/argo ui/mami; do
            test -d "$SRC/$package" || { echo "Missing decompiled package: $package"; exit 1; }
            mkdir -p "$DEST/$package"
            cp -a "$SRC/$package/." "$DEST/$package/"
          done
          test -s "$DEST/engines/argo/ArgoEngine.java"
          test -s "$DEST/engines/mami/MamiEngine.java"
          test -s "$DEST/ui/argo/ArgoScreenKt.java"
          test -s "$DEST/ui/mami/MamiScreenKt.java"
          {
            echo "Source: official mlmvpn/mlmvpn_android v1.2.49 universal release APK"
            echo "Release: https://github.com/mlmvpn/mlmvpn_android/releases/tag/v1.2.49"
            echo "Decompiler: JADX v1.5.7"
            echo "This is a GPL-3.0-derived recovery snapshot. Preserve the upstream attribution required by the source repository's license."
            echo
            find "$DEST" -type f -name '*.java' -printf '%P %s bytes\n' | sort
          } > "$DEST/PROVENANCE.txt"

      - name: Dump JADX problem methods in simple and fallback modes
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/mlmvpn-1.2.49.apk"
          J="$RUNNER_TEMP/jadx"
          RAW="recovered/upstream-1.2.49-jadx-raw"
          mkdir -p "$RAW"
          classes=(
            "com.mlmvpn.scanner.engines.argo.ArgoEngine"
            "com.mlmvpn.scanner.engines.argo.ArgoPool"
            "com.mlmvpn.scanner.engines.mami.MamiEngine"
          )
          for mode in simple fallback; do
            for cls in "${classes[@]}"; do
              out="$RAW/$mode/${cls##*.}.java"
              mkdir -p "$(dirname "$out")"
              set +e
              "$J/bin/jadx" --no-res --show-bad-code --no-inline-anonymous --no-inline-methods \
                --decompilation-mode "$mode" --single-class "$cls" \
                --single-class-output "$out" "$APK" > "$RUNNER_TEMP/jadx-$mode.log" 2>&1
              status=$?
              set -e
              echo "JADX $mode $cls exit=$status file=$(test -s "$out" && echo yes || echo no)"
              if test -s "$out"; then
                grep -nE "Method not decompiled|UnsupportedOperationException|JADX ERROR" "$out" | head -30 || true
              fi
            done
          done
          find "$RAW" -type f -size +0c -printf '%P %s bytes\n' | sort > "$RAW/INDEX.txt"
          test -s "$RAW/INDEX.txt"

      - name: Commit recovery snapshot to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "recovered-argo-mami-${GITHUB_RUN_ID}"
          git add recovered/upstream-1.2.49 recovered/upstream-1.2.49-jadx-raw
          git commit -m "Recover Argo and Mami sources and JADX fallback dumps from upstream 1.2.49 APK"
          git push origin "HEAD:refs/heads/recovered-argo-mami-${GITHUB_RUN_ID}"

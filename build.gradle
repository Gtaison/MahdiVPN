buildscript {
    ext.kotlin_version = '2.1.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 8.13 and Kotlin 2.1: the Android toolchain for this fork. AGP 8.13 bundles an R8
        // that reads Kotlin 2.x metadata, so the old R8 override for amneziawg is no longer needed.
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Since Kotlin 2.0 the Compose compiler ships with Kotlin, as this Gradle plugin.
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

allprojects {
}

task clean(type: Delete) {
    delete rootProject.buildDir
}